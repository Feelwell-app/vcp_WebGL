<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <title>Unity WebGL Player | Virtual Chat Partner</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <!-- ========== Firebase SDK ========== -->
    <!-- 使用 compat 版本以相容 jslib -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=720 height=1280 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <!-- <div id="unity-footer"> -->
        <!-- <div id="unity-logo-title-footer"></div> -->
        <!-- <div id="unity-fullscreen-button"></div> -->
<!-- #if SHOW_DIAGNOSTICS -->
        <!-- <img id="diagnostics-icon" src="TemplateData/webmemd-icon.png"> -->
<!-- #endif -->
        <!-- <div id="unity-build-title">Virtual Chat Partner</div> -->
      <!-- </div> -->
    </div>
    <script>

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      <!-- var fullscreenButton = document.querySelector("#unity-fullscreen-button"); -->
      var warningBanner = document.querySelector("#unity-warning");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
       // var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/vcp_WebGL.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/vcp_WebGL.data",
        frameworkUrl: buildUrl + "/vcp_WebGL.framework.js",
        codeUrl: buildUrl + "/vcp_WebGL.wasm",
		autoSyncPersistentDataPath: true,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Yu5h1 Studio",
        productName: "Virtual Chat Partner",
        productVersion: "0.1.2",
        showBanner: unityShowBanner,
		TARGET_SERVER: "https://vcp-proxy.jenyu5h10415.workers.dev",
        PROXY_SERVER: "https://vcp-proxy.jenyu5h10415.workers.dev",
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, interactive-widget=overlays-content';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // Keyboard inset: how much of the page the on-screen keyboard covers, as a fraction of the page height,
        // in window.vcpKeyboardInset (0 when there is no keyboard). Unity reads it every frame (VcpKeyboard.jslib)
        // and lifts its UI. visualViewport is the one source on iOS, Android and desktop. The height without a keyboard
        // is remembered, because a browser that resizes the page for the keyboard shrinks innerHeight as well.
        window.vcpKeyboardInset = 0;
        if (window.visualViewport) {
          var vv = window.visualViewport;
          var baseHeight = window.innerHeight;
          var debugBox = null;
          if (/[?&]kbdebug=1/.test(window.location.search)) {
            debugBox = document.createElement("div");
            debugBox.style.cssText = "position:fixed;left:0;top:0;z-index:99999;background:rgba(0,0,0,.7);color:#fff;font:11px monospace;padding:2px 4px;pointer-events:none;white-space:pre";
            document.body.appendChild(debugBox);
          }
          var isTyping = function () {
            var a = document.activeElement;
            return !!a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.isContentEditable === true);
          };
          var updateKeyboardInset = function () {
            var typing = isTyping();
            if (!typing || window.innerHeight > baseHeight) baseHeight = window.innerHeight;
            // pinch zoom also shrinks visualViewport; only a scale of 1 can be the keyboard
            var covered = typing && vv.scale <= 1.01 ? baseHeight - (vv.height + vv.offsetTop) : 0;
            window.vcpKeyboardInset = covered > 0 ? Math.min(covered / baseHeight, 0.9) : 0;
            if (debugBox) {
              var a = document.activeElement;
              debugBox.textContent = "inset " + window.vcpKeyboardInset.toFixed(3) + "\nbase " + baseHeight + " inner " + window.innerHeight +
                "\nvv h " + Math.round(vv.height) + " top " + Math.round(vv.offsetTop) + " scale " + vv.scale.toFixed(2) +
                "\nactive " + (a ? a.tagName : "-");
            }
          };
          vv.addEventListener("resize", updateKeyboardInset);
          vv.addEventListener("scroll", updateKeyboardInset);
          document.addEventListener("focusin", function () { setTimeout(updateKeyboardInset, 0); });
          document.addEventListener("focusout", function () { setTimeout(updateKeyboardInset, 150); });
          window.addEventListener("orientationchange", function () { setTimeout(function () { baseHeight = window.innerHeight; updateKeyboardInset(); }, 300); });
          updateKeyboardInset();
        }

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: the 9:16 canvas starts fitted to the window and is fitted again when the window is resized.
        // A change of the browser zoom keeps its CSS size, so the zoom scales it as it does any page.
        var fitCanvas = function () {
          var height = Math.min(window.innerHeight, window.innerWidth * 16 / 9);
          canvas.style.height = height + "px";
          canvas.style.width = (height * 9 / 16) + "px";
        };
        var lastPixelRatio = window.devicePixelRatio;
        window.addEventListener("resize", function () {
          if (window.devicePixelRatio !== lastPixelRatio) {
            lastPixelRatio = window.devicePixelRatio;
            return;
          }
          fitCanvas();
        });
        fitCanvas();
      }

//#if BACKGROUND_FILENAME
//      canvas.style.background = "url('" + buildUrl + "/vcp_WebGL.jpg') center / cover";
//#endif
      canvas.style.background = "url('" + buildUrl + "/banner.png') center / cover";
      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
              }).then((unityInstance) => {
				window.unityInstance = unityInstance;
                loadingBar.style.display = "none";
                <!-- fullscreenButton.onclick = () => { -->
                  <!-- unityInstance.SetFullscreen(1); -->
                <!-- }; -->

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
